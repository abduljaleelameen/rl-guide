services:
  - type: web
    name: rl-guide
    runtime: node
    buildCommand: npm install -g pnpm bun && pnpm install && pnpm build --filter=docs
    startCommand: cd apps/docs && pnpm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
    healthCheckPath: /
    autoDeploy: true
