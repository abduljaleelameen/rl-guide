<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#0f172a"/>
  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">The AI Training "Cake" Analogy</text>
  <text x="600" y="70" font-size="14" fill="#94a3b8" text-anchor="middle">3 Layers of Model Training</text>

  <rect x="300" y="150" width="600" height="150" fill="#8b5cf6" stroke="#a78bfa" stroke-width="3" rx="10"/>
  <text x="600" y="210" font-size="20" font-weight="bold" fill="white" text-anchor="middle"> Layer 3: RL (Frosting)</text>
  <text x="600" y="240" font-size="13" fill="#ede9fe" text-anchor="middle">Fine-tune behavior with rewards</text>
  <text x="600" y="270" font-size="12" fill="#c4b5fd" text-anchor="middle">Time: Hours | Cost: $10-100</text>

  <rect x="300" y="320" width="600" height="150" fill="#f59e0b" stroke="#fbbf24" stroke-width="3" rx="10"/>
  <text x="600" y="380" font-size="20" font-weight="bold" fill="white" text-anchor="middle"> Layer 2: Fine-tuning (Filling)</text>
  <text x="600" y="410" font-size="13" fill="#fef3c7" text-anchor="middle">Teach specific tasks/formats</text>
  <text x="600" y="440" font-size="12" fill="#fde68a" text-anchor="middle">Time: Hours-Days | Cost: $100-1K</text>

  <rect x="300" y="490" width="600" height="150" fill="#3b82f6" stroke="#60a5fa" stroke-width="3" rx="10"/>
  <text x="600" y="550" font-size="20" font-weight="bold" fill="white" text-anchor="middle"> Layer 1: Pre-training (Base)</text>
  <text x="600" y="580" font-size="13" fill="#dbeafe" text-anchor="middle">Learn language from massive data</text>
  <text x="600" y="610" font-size="12" fill="#bfdbfe" text-anchor="middle">Time: Months | Cost: $1M-100M</text>

  <rect x="100" y="680" width="1000" height="90" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="600" y="715" font-size="14" fill="#10b981" font-weight="bold" text-anchor="middle"> You only need to add the frosting (RL)!</text>
  <text x="600" y="745" font-size="12" fill="#cbd5e1" text-anchor="middle">Pre-trained models (Qwen, Llama) already have the cake & filling. Just add your custom RL layer.</text>
</svg>