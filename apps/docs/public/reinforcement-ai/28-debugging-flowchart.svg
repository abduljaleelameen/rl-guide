<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
  <rect width="1000" height="900" fill="#0f172a"/>
  <text x="500" y="35" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">RL Training Debugging Flowchart</text>

  <!-- Start -->
  <ellipse cx="500" cy="100" rx="80" ry="40" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <text x="500" y="108" font-size="14" fill="white" text-anchor="middle">Training Issue</text>

  <!-- Check 1: Rewards -->
  <rect x="350" y="170" width="300" height="70" fill="#8b5cf6" rx="8"/>
  <text x="500" y="200" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Are rewards increasing?</text>
  <path d="M 500 140 L 500 170" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Yes branch -->
  <path d="M 650 205 L 750 205" stroke="#10b981" stroke-width="2"/>
  <text x="700" y="195" font-size="12" fill="#10b981" font-weight="bold">YES</text>
  <rect x="750" y="170" width="200" height="70" fill="#10b981" rx="8"/>
  <text x="850" y="200" font-size="12" fill="white" text-anchor="middle">Training is working!</text>
  <text x="850" y="220" font-size="11" fill="#d1fae5" text-anchor="middle">Monitor quality</text>

  <!-- No branch -->
  <path d="M 500 240 L 500 290" stroke="#ef4444" stroke-width="2"/>
  <text x="520" y="270" font-size="12" fill="#ef4444" font-weight="bold">NO</text>

  <!-- Check 2: Loss -->
  <rect x="350" y="290" width="300" height="70" fill="#8b5cf6" rx="8"/>
  <text x="500" y="320" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Is loss decreasing?</text>

  <!-- Loss yes -->
  <path d="M 650 325 L 750 325" stroke="#fbbf24" stroke-width="2"/>
  <text x="700" y="315" font-size="12" fill="#fbbf24" font-weight="bold">YES</text>
  <rect x="750" y="290" width="200" height="90" fill="#fbbf24" rx="8"/>
  <text x="850" y="320" font-size="11" fill="white" text-anchor="middle">Reward function</text>
  <text x="850" y="340" font-size="11" fill="white" text-anchor="middle">may be too</text>
  <text x="850" y="360" font-size="11" fill="white" text-anchor="middle">permissive</text>

  <!-- Loss no -->
  <path d="M 500 360 L 500 410" stroke="#ef4444" stroke-width="2"/>
  <text x="520" y="390" font-size="12" fill="#ef4444" font-weight="bold">NO</text>

  <!-- Check 3: LR -->
  <rect x="350" y="410" width="300" height="70" fill="#8b5cf6" rx="8"/>
  <text x="500" y="440" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Learning rate too high?</text>

  <!-- LR yes -->
  <path d="M 350 445 L 250 445" stroke="#ef4444" stroke-width="2"/>
  <text x="310" y="435" font-size="12" fill="#ef4444" font-weight="bold">YES</text>
  <rect x="50" y="410" width="200" height="90" fill="#ef4444" rx="8"/>
  <text x="150" y="440" font-size="11" fill="white" text-anchor="middle">Reduce LR</text>
  <text x="150" y="460" font-size="11" fill="#fecaca" text-anchor="middle">(try 1e-6 or 5e-7)</text>
  <text x="150" y="480" font-size="11" fill="#fecaca" text-anchor="middle">Use scheduler</text>

  <!-- LR no -->
  <path d="M 500 480 L 500 530" stroke="#10b981" stroke-width="2"/>
  <text x="520" y="510" font-size="12" fill="#10b981" font-weight="bold">NO</text>

  <!-- Check 4: Batch Size -->
  <rect x="350" y="530" width="300" height="70" fill="#8b5cf6" rx="8"/>
  <text x="500" y="560" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Batch size too small?</text>

  <!-- Batch yes -->
  <path d="M 650 565 L 750 565" stroke="#fbbf24" stroke-width="2"/>
  <text x="700" y="555" font-size="12" fill="#fbbf24" font-weight="bold">YES</text>
  <rect x="750" y="530" width="200" height="90" fill="#fbbf24" rx="8"/>
  <text x="850" y="560" font-size="11" fill="white" text-anchor="middle">Increase batch size</text>
  <text x="850" y="580" font-size="11" fill="#fef3c7" text-anchor="middle">(try 32-128)</text>
  <text x="850" y="600" font-size="11" fill="#fef3c7" text-anchor="middle">More stable gradients</text>

  <!-- Batch no -->
  <path d="M 500 600 L 500 650" stroke="#ef4444" stroke-width="2"/>
  <text x="520" y="630" font-size="12" fill="#ef4444" font-weight="bold">NO</text>

  <!-- Check 5: Reward Design -->
  <rect x="300" y="650" width="400" height="90" fill="#ef4444" rx="8"/>
  <text x="500" y="680" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Likely Reward Function Issue:</text>
  <text x="330" y="710" font-size="12" fill="#fecaca"> Too sparse (no signal)</text>
  <text x="330" y="730" font-size="12" fill="#fecaca"> Wrong design (rewards bad behavior)</text>

  <!-- Solution -->
  <rect x="200" y="770" width="600" height="100" fill="#10b981" rx="8"/>
  <text x="500" y="800" font-size="14" fill="white" text-anchor="middle" font-weight="bold"> Solutions:</text>
  <text x="230" y="830" font-size="12" fill="#d1fae5">1. Add intermediate rewards (shape the reward)</text>
  <text x="230" y="855" font-size="12" fill="#d1fae5">2. Test reward function on known good/bad examples</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
</svg>
