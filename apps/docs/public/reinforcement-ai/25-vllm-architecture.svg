<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0f172a"/>
  <text x="600" y="35" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">vLLM Integration Architecture</text>

  <rect x="100" y="100" width="450" height="400" fill="#1e293b" stroke="#ef4444" stroke-width="3" rx="10"/>
  <text x="325" y="140" font-size="18" fill="#ef4444" font-weight="bold" text-anchor="middle">Traditional (Slow)</text>
  <rect x="130" y="170" width="370" height="80" fill="#3b82f6" rx="8"/>
  <text x="315" y="205" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Model (Training + Generation)</text>
  <text x="315" y="230" font-size="12" fill="#dbeafe" text-anchor="middle">400 tokens/sec</text>
  <text x="150" y="290" font-size="13" fill="#cbd5e1"> 12 hours training</text>
  <text x="150" y="320" font-size="13" fill="#cbd5e1"> $100 cost</text>
  <text x="150" y="350" font-size="13" fill="#cbd5e1"> Generation bottleneck</text>

  <rect x="650" y="100" width="450" height="400" fill="#1e293b" stroke="#10b981" stroke-width="3" rx="10"/>
  <text x="875" y="140" font-size="18" fill="#10b981" font-weight="bold" text-anchor="middle">vLLM (Fast)</text>
  <rect x="680" y="170" width="370" height="60" fill="#3b82f6" rx="8"/>
  <text x="865" y="205" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Training Model</text>
  <text x="865" y="222" font-size="11" fill="#dbeafe" text-anchor="middle">(weight updates only)</text>

  <rect x="680" y="250" width="370" height="80" fill="#fbbf24" rx="8"/>
  <text x="865" y="285" font-size="13" fill="white" text-anchor="middle" font-weight="bold">vLLM Server (Separate)</text>
  <text x="865" y="310" font-size="12" fill="#fef3c7" text-anchor="middle">4000+ tokens/sec </text>

  <text x="700" y="380" font-size="13" fill="#cbd5e1"> 1.2 hours training (10x faster!)</text>
  <text x="700" y="410" font-size="13" fill="#cbd5e1"> $10 cost (90% savings)</text>
  <text x="700" y="440" font-size="13" fill="#cbd5e1"> Generation optimized</text>

  <rect x="100" y="530" width="1000" height="50" fill="#10b981" rx="8"/>
  <text x="600" y="563" font-size="16" font-weight="bold" fill="white" text-anchor="middle"> vLLM uses PagedAttention + Continuous Batching for 10x speedup!</text>
</svg>