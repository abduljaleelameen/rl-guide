<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0f172a"/>
  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Open Source "Droughts" Timeline</text>
  <line x1="100" y1="300" x2="1100" y2="300" stroke="#475569" stroke-width="3"/>

  <circle cx="200" cy="300" r="15" fill="#3b82f6"/>
  <text x="200" y="250" font-size="14" fill="#3b82f6" text-anchor="middle" font-weight="bold">GPT-1</text>
  <text x="200" y="270" font-size="11" fill="#94a3b8" text-anchor="middle">2018</text>
  <text x="200" y="350" font-size="10" fill="#cbd5e1" text-anchor="middle">Open</text>

  <circle cx="400" cy="300" r="15" fill="#ef4444"/>
  <text x="400" y="250" font-size="14" fill="#ef4444" text-anchor="middle" font-weight="bold">GPT-3</text>
  <text x="400" y="270" font-size="11" fill="#94a3b8" text-anchor="middle">2020</text>
  <text x="400" y="350" font-size="10" fill="#ef4444" text-anchor="middle">Closed!</text>
  <rect x="200" y="380" width="400" height="40" fill="#7f1d1d" rx="6"/>
  <text x="400" y="405" font-size="12" fill="#fecaca" text-anchor="middle">18-month drought</text>

  <circle cx="700" cy="300" r="18" fill="#10b981"/>
  <text x="700" y="245" font-size="16" fill="#10b981" text-anchor="middle" font-weight="bold">Llama</text>
  <text x="700" y="265" font-size="11" fill="#94a3b8" text-anchor="middle">Feb 2023</text>
  <text x="700" y="355" font-size="10" fill="#10b981" text-anchor="middle">Open again!</text>

  <circle cx="950" cy="300" r="20" fill="#10b981"/>
  <text x="950" y="240" font-size="18" fill="#10b981" text-anchor="middle" font-weight="bold">Qwen/Mistral</text>
  <text x="950" y="260" font-size="11" fill="#94a3b8" text-anchor="middle">2023-2024</text>
  <text x="950" y="360" font-size="10" fill="#10b981" text-anchor="middle">Competitive!</text>

  <rect x="100" y="480" width="1000" height="90" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="600" y="515" font-size="14" fill="#10b981" font-weight="bold" text-anchor="middle">Good News: Open source is thriving again!</text>
  <text x="600" y="545" font-size="12" fill="#cbd5e1" text-anchor="middle">Qwen 2.5, Llama 3, Mistral are now competitive with closed models</text>
</svg>