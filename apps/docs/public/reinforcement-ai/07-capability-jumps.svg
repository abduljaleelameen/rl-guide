<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="600" y="35" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Capability Jumps with Model Size</text>

  <line x1="100" y1="600" x2="1100" y2="600" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="150" x2="100" y2="600" stroke="#475569" stroke-width="2"/>

  <text x="80" y="160" font-size="12" fill="#cbd5e1" text-anchor="end">High</text>
  <text x="50" y="380" font-size="12" fill="#cbd5e1" text-anchor="end">Capability</text>
  <text x="80" y="600" font-size="12" fill="#cbd5e1" text-anchor="end">Low</text>

  <!-- Curve showing jumps -->
  <path d="M 150 550 L 300 530 L 450 450 L 600 350 L 750 250 L 900 180 L 1050 160"
        fill="none" stroke="#10b981" stroke-width="4"/>

  <!-- Model points -->
  <circle cx="300" cy="530" r="10" fill="#3b82f6"/>
  <text x="300" y="560" font-size="11" fill="#3b82f6" text-anchor="middle">1B</text>

  <circle cx="600" cy="350" r="12" fill="#f59e0b"/>
  <text x="600" y="385" font-size="11" fill="#f59e0b" text-anchor="middle">7B</text>
  <text x="600" y="405" font-size="10" fill="#fbbf24">Basic tasks</text>

  <circle cx="900" cy="180" r="15" fill="#8b5cf6"/>
  <text x="900" y="220" font-size="12" fill="#8b5cf6" text-anchor="middle" font-weight="bold">70B+</text>
  <text x="900" y="240" font-size="10" fill="#a78bfa">Expert level</text>

  <rect x="100" y="100" width="300" height="30" fill="#1e293b" rx="6"/>
  <text x="250" y="120" font-size="11" fill="#cbd5e1" text-anchor="middle">Emergent abilities appear suddenly!</text>
</svg>