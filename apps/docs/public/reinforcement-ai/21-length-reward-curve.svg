<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Length Reward Curve (Gaussian)</text>

  <!-- Axes -->
  <line x1="100" y1="550" x2="1100" y2="550" stroke="#475569" stroke-width="2"/>
  <line x1="100" y1="150" x2="100" y2="550" stroke="#475569" stroke-width="2"/>

  <!-- Gaussian curve centered at 50 -->
  <path d="M 100 500 Q 300 400, 600 150 T 1100 500" fill="none" stroke="#10b981" stroke-width="4"/>

  <!-- Target line -->
  <line x1="600" y1="550" x2="600" y2="150" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="600" y="590" font-size="14" fill="#f59e0b" font-weight="bold" text-anchor="middle">Target: 50 words</text>

  <!-- Reward values -->
  <text x="80" y="160" font-size="12" fill="#10b981" text-anchor="end">+3.0</text>
  <text x="80" y="300" font-size="12" fill="#fbbf24" text-anchor="end">+1.5</text>
  <text x="80" y="450" font-size="12" fill="#f59e0b" text-anchor="end">+0.5</text>
  <text x="80" y="555" font-size="12" fill="#ef4444" text-anchor="end">0.0</text>

  <!-- Word count markers -->
  <text x="200" y="570" font-size="11" fill="#cbd5e1" text-anchor="middle">20</text>
  <text x="400" y="570" font-size="11" fill="#cbd5e1" text-anchor="middle">35</text>
  <text x="600" y="570" font-size="11" fill="#cbd5e1" text-anchor="middle">50</text>
  <text x="800" y="570" font-size="11" fill="#cbd5e1" text-anchor="middle">65</text>
  <text x="1000" y="570" font-size="11" fill="#cbd5e1" text-anchor="middle">80</text>

  <!-- Penalty zones -->
  <rect x="100" y="100" width="250" height="30" fill="#ef4444" opacity="0.3" rx="4"/>
  <text x="225" y="120" font-size="11" fill="#ef4444" font-weight="bold" text-anchor="middle">Too Short (&lt;20): -2.0</text>

  <rect x="850" y="100" width="250" height="30" fill="#ef4444" opacity="0.3" rx="4"/>
  <text x="975" y="120" font-size="11" fill="#ef4444" font-weight="bold" text-anchor="middle">Too Long (&gt;100): -1.5</text>

  <!-- Formula -->
  <rect x="100" y="620" width="1000" height="60" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="600" y="655" font-size="14" fill="#cbd5e1" text-anchor="middle" font-family="monospace">reward = 3.0  e^(-(distance)/(2))  where  = tolerance/2 = 5</text>
</svg>