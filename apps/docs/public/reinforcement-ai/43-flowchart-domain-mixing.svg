<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1200">
  <rect width="1100" height="1200" fill="#0f172a"/>
  <text x="550" y="35" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Flowchart: Domain Mixing Strategy (example7.py)</text>

  <!-- Start -->
  <ellipse cx="550" cy="90" rx="70" ry="35" fill="#10b981" stroke="#34d399" stroke-width="2"/>
  <text x="550" y="98" font-size="14" fill="white" text-anchor="middle" font-weight="bold">START</text>

  <path d="M 550 125 L 550 160" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Setup -->
  <rect x="400" y="160" width="300" height="70" fill="#3b82f6" rx="8"/>
  <text x="550" y="190" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Load Model &amp; Datasets</text>
  <text x="550" y="210" font-size="11" fill="#dbeafe" text-anchor="middle">GPT-2 + multi-domain data</text>

  <path d="M 550 230 L 550 270" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Define Mix -->
  <rect x="100" y="270" width="900" height="150" fill="#1e293b" stroke="#8b5cf6" stroke-width="3" rx="10"/>
  <text x="550" y="305" font-size="16" fill="#8b5cf6" font-weight="bold" text-anchor="middle">Define Domain Mix Ratios</text>

  <rect x="130" y="335" width="200" height="70" fill="#10b981" rx="6"/>
  <text x="230" y="365" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Math: 40%</text>
  <text x="230" y="385" font-size="10" fill="#d1fae5" text-anchor="middle">GSM8K, MATH</text>

  <rect x="350" y="335" width="200" height="70" fill="#3b82f6" rx="6"/>
  <text x="450" y="365" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Code: 30%</text>
  <text x="450" y="385" font-size="10" fill="#dbeafe" text-anchor="middle">HumanEval</text>

  <rect x="570" y="335" width="200" height="70" fill="#fbbf24" rx="6"/>
  <text x="670" y="365" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Reasoning: 20%</text>
  <text x="670" y="385" font-size="10" fill="#fef3c7" text-anchor="middle">ARC, MMLU</text>

  <rect x="790" y="335" width="180" height="70" fill="#ec4899" rx="6"/>
  <text x="880" y="365" font-size="12" fill="white" text-anchor="middle" font-weight="bold">General: 10%</text>
  <text x="880" y="385" font-size="10" fill="#fce7f3" text-anchor="middle">OpenAI</text>

  <path d="M 550 420 L 550 460" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Training Loop -->
  <rect x="350" y="460" width="400" height="50" fill="#8b5cf6" rx="8"/>
  <text x="550" y="490" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Training Loop (20000 steps)</text>

  <path d="M 550 510 L 550 550" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sample Batch -->
  <rect x="300" y="550" width="500" height="90" fill="#fbbf24" rx="8"/>
  <text x="550" y="580" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Sample Mixed Batch (64 prompts)</text>
  <text x="550" y="605" font-size="11" fill="#fef3c7" text-anchor="middle"> 26 math, 19 code, 13 reasoning, 6 general</text>
  <text x="550" y="625" font-size="11" fill="#fef3c7" text-anchor="middle"> Maintain ratio distribution</text>

  <path d="M 550 640 L 550 680" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Generate -->
  <rect x="400" y="680" width="300" height="70" fill="#fbbf24" rx="8"/>
  <text x="550" y="710" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Generate Responses</text>
  <text x="550" y="730" font-size="11" fill="#fef3c7" text-anchor="middle">model.generate(mixed_batch)</text>

  <path d="M 550 750 L 550 790" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Domain-Specific Rewards -->
  <rect x="100" y="790" width="900" height="200" fill="#1e293b" stroke="#ec4899" stroke-width="3" rx="10"/>
  <text x="550" y="825" font-size="16" fill="#ec4899" font-weight="bold" text-anchor="middle">DOMAIN-SPECIFIC REWARD FUNCTIONS</text>

  <text x="130" y="860" font-size="12" fill="#10b981" font-weight="bold">Math prompts:</text>
  <text x="150" y="880" font-size="11" fill="#cbd5e1"> Verify answer correctness (binary)</text>

  <text x="130" y="915" font-size="12" fill="#3b82f6" font-weight="bold">Code prompts:</text>
  <text x="150" y="935" font-size="11" fill="#cbd5e1"> Run unit tests, check syntax</text>

  <text x="600" y="860" font-size="12" fill="#fbbf24" font-weight="bold">Reasoning prompts:</text>
  <text x="620" y="880" font-size="11" fill="#cbd5e1"> LLM-as-judge scores logic</text>

  <text x="600" y="915" font-size="12" fill="#ec4899" font-weight="bold">General prompts:</text>
  <text x="620" y="935" font-size="11" fill="#cbd5e1"> Sentiment + coherence</text>

  <text x="130" y="970" font-size="11" fill="#94a3b8" font-style="italic">Each prompt scored by its domain-specific function</text>

  <path d="M 550 990 L 550 1030" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Normalize -->
  <rect x="400" y="1030" width="300" height="70" fill="#06b6d4" rx="8"/>
  <text x="550" y="1060" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Normalize All Rewards</text>
  <text x="550" y="1080" font-size="11" fill="#cffafe" text-anchor="middle">advantages = (rewards - mean) / std</text>

  <path d="M 550 1100 L 550 1140" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Update -->
  <rect x="400" y="1140" width="300" height="50" fill="#8b5cf6" rx="8"/>
  <text x="550" y="1170" font-size="13" fill="white" text-anchor="middle" font-weight="bold">GRPO Update (Single Policy)</text>

  <!-- Loop -->
  <path d="M 350 510 L 250 510 L 250 595 L 300 595" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <text x="270" y="550" font-size="11" fill="#fbbf24" font-weight="bold">Loop</text>

  <!-- End -->
  <ellipse cx="550" cy="1192" rx="50" ry="8" fill="#ef4444" stroke="#f87171" stroke-width="2"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
</svg>
