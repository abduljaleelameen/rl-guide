<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 900">
  <rect width="1000" height="900" fill="#0f172a"/>
  <text x="500" y="35" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Math Verifier Decision Tree</text>

  <!-- Start -->
  <ellipse cx="500" cy="100" rx="80" ry="40" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <text x="500" y="108" font-size="14" fill="white" text-anchor="middle" font-weight="bold">Extract Number</text>

  <!-- Decision 1 -->
  <path d="M 500 160 L 580 210 L 500 260 L 420 210 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="215" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="bold">Found?</text>

  <!-- No branch -->
  <rect x="650" y="180" width="200" height="60" fill="#ef4444" rx="8"/>
  <text x="750" y="207" font-size="14" fill="white" text-anchor="middle" font-weight="bold">NO NUMBER</text>
  <text x="750" y="227" font-size="12" fill="#fecaca" text-anchor="middle">reward = -2.0</text>

  <!-- Yes - Decision 2 -->
  <path d="M 500 320 L 580 370 L 500 420 L 420 370 Z" fill="#10b981" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="370" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Exact</text>
  <text x="500" y="385" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Match?</text>

  <!-- Perfect -->
  <rect x="200" y="340" width="180" height="60" fill="#10b981" rx="8"/>
  <text x="290" y="367" font-size="14" fill="white" text-anchor="middle" font-weight="bold">PERFECT!</text>
  <text x="290" y="387" font-size="12" fill="#d1fae5" text-anchor="middle">reward = +3.0</text>

  <!-- Calculate Error -->
  <rect x="410" y="490" width="180" height="60" fill="#3b82f6" rx="8"/>
  <text x="500" y="517" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Calculate</text>
  <text x="500" y="537" font-size="12" fill="#dbeafe" text-anchor="middle">error %</text>

  <!-- Graduated Rewards -->
  <rect x="100" y="610" width="160" height="70" fill="#10b981" rx="6"/>
  <text x="180" y="635" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Error &lt; 10%</text>
  <text x="180" y="655" font-size="11" fill="#d1fae5" text-anchor="middle">reward = +2.0</text>

  <rect x="290" y="610" width="160" height="70" fill="#fbbf24" rx="6"/>
  <text x="370" y="635" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Error &lt; 25%</text>
  <text x="370" y="655" font-size="11" fill="#fef3c7" text-anchor="middle">reward = +1.0</text>

  <rect x="480" y="610" width="160" height="70" fill="#f59e0b" rx="6"/>
  <text x="560" y="635" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Error &lt; 50%</text>
  <text x="560" y="655" font-size="11" fill="#fef3c7" text-anchor="middle">reward = +0.5</text>

  <rect x="670" y="610" width="160" height="70" fill="#ef4444" rx="6"/>
  <text x="750" y="635" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Error  50%</text>
  <text x="750" y="655" font-size="11" fill="#fecaca" text-anchor="middle">reward = -1.0</text>

  <!-- Example -->
  <rect x="100" y="750" width="800" height="120" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="120" y="785" font-size="13" fill="#cbd5e1" font-weight="bold">Example: 15 + 27 = ?</text>
  <text x="140" y="815" font-size="12" fill="#94a3b8">Correct: 42</text>
  <text x="140" y="840" font-size="12" fill="#94a3b8">Model says: 41</text>
  <text x="140" y="865" font-size="12" fill="#10b981"> Error = 2.4%  Reward = +2.0 </text>

  <!-- Arrows -->
  <line x1="500" y1="140" x2="500" y2="160" stroke="#10b981" stroke-width="2"/>
  <line x1="580" y1="210" x2="650" y2="210" stroke="#ef4444" stroke-width="2"/>
  <text x="620" y="200" font-size="11" fill="#ef4444" font-weight="bold">NO</text>

  <line x1="500" y1="260" x2="500" y2="320" stroke="#10b981" stroke-width="2"/>
  <text x="520" y="290" font-size="11" fill="#10b981" font-weight="bold">YES</text>

  <line x1="420" y1="370" x2="380" y2="370" stroke="#10b981" stroke-width="2"/>
  <text x="410" y="360" font-size="11" fill="#10b981" font-weight="bold">YES</text>

  <line x1="500" y1="420" x2="500" y2="490" stroke="#10b981" stroke-width="2"/>
  <text x="520" y="450" font-size="11" fill="#10b981" font-weight="bold">NO</text>

  <line x1="500" y1="550" x2="180" y2="610" stroke="#10b981" stroke-width="2"/>
  <line x1="500" y1="550" x2="370" y2="610" stroke="#fbbf24" stroke-width="2"/>
  <line x1="500" y1="550" x2="560" y2="610" stroke="#f59e0b" stroke-width="2"/>
  <line x1="500" y1="550" x2="750" y2="610" stroke="#ef4444" stroke-width="2"/>
</svg>