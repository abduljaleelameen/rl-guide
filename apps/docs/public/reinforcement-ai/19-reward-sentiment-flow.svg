<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#0f172a"/>

  <!-- Title -->
  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Sentiment Reward Function Flow</text>

  <!-- Step 1: Input -->
  <rect x="450" y="100" width="300" height="80" fill="#3b82f6" stroke="#60a5fa" stroke-width="2" rx="8"/>
  <text x="600" y="135" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Model Output</text>
  <text x="600" y="160" font-size="12" fill="#dbeafe" text-anchor="middle">"I love sunny days!"</text>

  <!-- Arrow 1 -->
  <line x1="600" y1="180" x2="600" y2="220" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 2: Sentiment Analysis -->
  <rect x="450" y="220" width="300" height="80" fill="#8b5cf6" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <text x="600" y="255" font-size="16" font-weight="bold" fill="white" text-anchor="middle">TextBlob Analysis</text>
  <text x="600" y="280" font-size="12" fill="#ede9fe" text-anchor="middle">polarity = +0.75</text>

  <!-- Arrow 2 -->
  <line x1="600" y1="300" x2="600" y2="340" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 3: Base Reward -->
  <rect x="450" y="340" width="300" height="80" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" rx="8"/>
  <text x="600" y="375" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Base Reward</text>
  <text x="600" y="400" font-size="12" fill="#fef3c7" text-anchor="middle">reward = polarity  3.0 = 2.25</text>

  <!-- Arrow 3 -->
  <line x1="600" y1="420" x2="600" y2="460" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Step 4: Bonuses -->
  <rect x="450" y="460" width="300" height="120" fill="#10b981" stroke="#34d399" stroke-width="2" rx="8"/>
  <text x="600" y="495" font-size="16" font-weight="bold" fill="white" text-anchor="middle">Apply Bonuses</text>
  <text x="600" y="520" font-size="11" fill="#d1fae5" text-anchor="middle"> polarity &gt; 0.5: +0.5</text>
  <text x="600" y="540" font-size="11" fill="#d1fae5" text-anchor="middle"> 20-100 words: +0.2</text>
  <text x="600" y="560" font-size="11" fill="#f3f4f6" text-anchor="middle">Final: 2.25 + 0.5 + 0.2 = 2.95</text>

  <!-- Formula Box -->
  <rect x="50" y="100" width="350" height="480" fill="#1e293b" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="225" y="135" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Reward Formula</text>

  <text x="70" y="175" font-size="13" fill="#cbd5e1">1. Analyze sentiment:</text>
  <text x="90" y="200" font-size="12" fill="#94a3b8" font-family="monospace">polarity = blob.sentiment.polarity</text>
  <text x="90" y="220" font-size="11" fill="#64748b">   Range: -1.0 to +1.0</text>

  <text x="70" y="260" font-size="13" fill="#cbd5e1">2. Base reward:</text>
  <text x="90" y="285" font-size="12" fill="#94a3b8" font-family="monospace">reward = polarity  3.0</text>
  <text x="90" y="305" font-size="11" fill="#64748b">   Range: -3.0 to +3.0</text>

  <text x="70" y="345" font-size="13" fill="#cbd5e1">3. Bonuses:</text>
  <text x="90" y="370" font-size="12" fill="#10b981" font-family="monospace">if polarity &gt; 0.5:</text>
  <text x="110" y="390" font-size="12" fill="#10b981" font-family="monospace">reward += 0.5</text>

  <text x="90" y="425" font-size="12" fill="#f59e0b" font-family="monospace">if word_count &lt; 20:</text>
  <text x="110" y="445" font-size="12" fill="#f59e0b" font-family="monospace">reward -= 2.0</text>

  <text x="90" y="480" font-size="12" fill="#3b82f6" font-family="monospace">if 20 &lt; words &lt; 100:</text>
  <text x="110" y="500" font-size="12" fill="#3b82f6" font-family="monospace">reward += 0.2</text>

  <text x="70" y="540" font-size="13" fill="#cbd5e1">4. Return:</text>
  <text x="90" y="565" font-size="12" fill="#94a3b8" font-family="monospace">return final_reward</text>

  <!-- Example Box -->
  <rect x="800" y="100" width="350" height="480" fill="#1e293b" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="975" y="135" font-size="16" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Examples</text>

  <!-- Example 1 -->
  <rect x="820" y="160" width="310" height="90" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
  <text x="975" y="185" font-size="12" fill="#10b981" font-weight="bold" text-anchor="middle">"I love this!"</text>
  <text x="830" y="210" font-size="11" fill="#cbd5e1">Polarity: +0.8</text>
  <text x="830" y="230" font-size="11" fill="#cbd5e1">Reward: 2.4 + 0.5 = 2.9</text>

  <!-- Example 2 -->
  <rect x="820" y="270" width="310" height="90" fill="#0f172a" stroke="#fbbf24" stroke-width="2" rx="6"/>
  <text x="975" y="295" font-size="12" fill="#fbbf24" font-weight="bold" text-anchor="middle">"It's okay, I guess."</text>
  <text x="830" y="320" font-size="11" fill="#cbd5e1">Polarity: +0.15</text>
  <text x="830" y="340" font-size="11" fill="#cbd5e1">Reward: 0.45 + 0.2 = 0.65</text>

  <!-- Example 3 -->
  <rect x="820" y="380" width="310" height="90" fill="#0f172a" stroke="#ef4444" stroke-width="2" rx="6"/>
  <text x="975" y="405" font-size="12" fill="#ef4444" font-weight="bold" text-anchor="middle">"I hate Mondays."</text>
  <text x="830" y="430" font-size="11" fill="#cbd5e1">Polarity: -0.6</text>
  <text x="830" y="450" font-size="11" fill="#cbd5e1">Reward: -1.8 -1.0 = -2.8</text>

  <text x="975" y="530" font-size="11" fill="#94a3b8" text-anchor="middle" font-style="italic">Model learns to generate positive text!</text>

  <!-- Bottom -->
  <rect x="50" y="620" width="1100" height="60" fill="#10b981" rx="8"/>
  <text x="600" y="660" font-size="16" font-weight="bold" fill="white" text-anchor="middle"> Result: Model trained to maximize positive sentiment in all outputs</text>

</svg>