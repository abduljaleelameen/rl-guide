<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Multi-Metric Weighted Scoring</text>

  <!-- Pie chart showing weights -->
  <circle cx="300" cy="300" r="150" fill="none" stroke="#334155" stroke-width="2"/>

  <path d="M 300 300 L 300 150 A 150 150 0 0 1 400 200 Z" fill="#10b981" opacity="0.8"/>
  <text x="330" y="200" font-size="14" fill="white" font-weight="bold">40%</text>
  <text x="320" y="220" font-size="11" fill="white">Correctness</text>

  <path d="M 300 300 L 400 200 A 150 150 0 0 1 430 320 Z" fill="#f59e0b" opacity="0.8"/>
  <text x="395" y="270" font-size="14" fill="white" font-weight="bold">25%</text>
  <text x="380" y="290" font-size="11" fill="white">Concise</text>

  <path d="M 300 300 L 430 320 A 150 150 0 0 1 350 420 Z" fill="#8b5cf6" opacity="0.8"/>
  <text x="370" y="365" font-size="14" fill="white" font-weight="bold">20%</text>
  <text x="360" y="385" font-size="11" fill="white">Clarity</text>

  <path d="M 300 300 L 350 420 A 150 150 0 0 1 300 150 Z" fill="#ec4899" opacity="0.8"/>
  <text x="230" y="350" font-size="14" fill="white" font-weight="bold">15%</text>
  <text x="230" y="370" font-size="11" fill="white">Tone</text>

  <!-- Calculation Example -->
  <rect x="550" y="120" width="600" height="520" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="850" y="160" font-size="18" fill="#10b981" font-weight="bold" text-anchor="middle">Example Calculation</text>

  <text x="580" y="200" font-size="14" fill="#cbd5e1" font-weight="bold">Question: "What is the capital of France?"</text>
  <text x="580" y="225" font-size="13" fill="#94a3b8">Model output: "Paris is the capital of France."</text>

  <rect x="580" y="250" width="540" height="350" fill="#0f172a" stroke="#334155" stroke-width="1" rx="6"/>

  <text x="600" y="285" font-size="13" fill="#10b981" font-weight="bold">1. Correctness (40%):</text>
  <text x="620" y="310" font-size="12" fill="#94a3b8">"Paris" present  Score: 3.0</text>
  <text x="620" y="330" font-size="12" fill="#cbd5e1">3.0  0.40 = <text fill="#10b981" font-weight="bold">1.20</text></text>

  <text x="600" y="365" font-size="13" fill="#f59e0b" font-weight="bold">2. Conciseness (25%):</text>
  <text x="620" y="390" font-size="12" fill="#94a3b8">7 words (ideal: 20-50)  Score: 3.0</text>
  <text x="620" y="410" font-size="12" fill="#cbd5e1">3.0  0.25 = <text fill="#f59e0b" font-weight="bold">0.75</text></text>

  <text x="600" y="445" font-size="13" fill="#8b5cf6" font-weight="bold">3. Clarity (20%):</text>
  <text x="620" y="470" font-size="12" fill="#94a3b8">1 sentence (good)  Score: 3.0</text>
  <text x="620" y="490" font-size="12" fill="#cbd5e1">3.0  0.20 = <text fill="#8b5cf6" font-weight="bold">0.60</text></text>

  <text x="600" y="525" font-size="13" fill="#ec4899" font-weight="bold">4. Tone (15%):</text>
  <text x="620" y="550" font-size="12" fill="#94a3b8">Positive, professional  Score: 3.0</text>
  <text x="620" y="570" font-size="12" fill="#cbd5e1">3.0  0.15 = <text fill="#ec4899" font-weight="bold">0.45</text></text>

  <line x1="600" y1="585" x2="1100" y2="585" stroke="#10b981" stroke-width="2"/>

  <text x="850" y="615" font-size="16" fill="#10b981" font-weight="bold" text-anchor="middle">Final Reward: 1.20 + 0.75 + 0.60 + 0.45 = 3.00 </text>

  <rect x="100" y="520" width="400" height="60" fill="#10b981" opacity="0.2" rx="8"/>
  <text x="300" y="555" font-size="13" fill="#10b981" font-weight="bold" text-anchor="middle"> Weights must sum to 1.0!</text>
</svg>