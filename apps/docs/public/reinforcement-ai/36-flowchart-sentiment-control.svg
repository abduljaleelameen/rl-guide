<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1400" fill="#0f172a"/>

  <!-- Title -->
  <text x="500" y="35" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Sentiment Control Training Flow</text>

  <!-- START -->
  <ellipse cx="500" cy="90" rx="80" ry="40" fill="#10b981" stroke="#34d399" stroke-width="2"/>
  <text x="500" y="98" font-size="16" font-weight="bold" fill="white" text-anchor="middle">START</text>

  <!-- Step 1: Load Model -->
  <rect x="350" y="150" width="300" height="60" fill="#3b82f6" stroke="#60a5fa" stroke-width="2" rx="8"/>
  <text x="500" y="175" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Load Model</text>
  <text x="500" y="195" font-size="11" fill="#dbeafe" text-anchor="middle">Qwen2.5-3B, 4-bit quant</text>

  <!-- Step 2: Apply LoRA -->
  <rect x="350" y="240" width="300" height="60" fill="#3b82f6" stroke="#60a5fa" stroke-width="2" rx="8"/>
  <text x="500" y="265" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Apply LoRA</text>
  <text x="500" y="285" font-size="11" fill="#dbeafe" text-anchor="middle">rank=16, alpha=32</text>

  <!-- Step 3: Load Dataset -->
  <rect x="350" y="330" width="300" height="60" fill="#fbbf24" stroke="#f59e0b" stroke-width="2" rx="8"/>
  <text x="500" y="355" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Load Training Data</text>
  <text x="500" y="375" font-size="11" fill="#fef3c7" text-anchor="middle">10 prompts</text>

  <!-- Training Loop -->
  <rect x="350" y="420" width="300" height="60" fill="#ec4899" stroke="#f472b6" stroke-width="2" rx="8"/>
  <text x="500" y="445" font-size="14" font-weight="bold" fill="white" text-anchor="middle">TRAINING LOOP</text>
  <text x="500" y="465" font-size="11" fill="#fce7f3" text-anchor="middle">(2 epochs)</text>

  <!-- Step 4: Generate -->
  <rect x="350" y="510" width="300" height="60" fill="#8b5cf6" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <text x="500" y="535" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Generate 8 Responses</text>
  <text x="500" y="555" font-size="11" fill="#ede9fe" text-anchor="middle">temperature=1.2</text>

  <!-- Reward Function Box -->
  <rect x="50" y="600" width="900" height="300" fill="#1e293b" stroke="#f59e0b" stroke-width="3" rx="12"/>
  <text x="500" y="635" font-size="16" font-weight="bold" fill="#f59e0b" text-anchor="middle">SENTIMENT REWARD FUNCTION</text>

  <!-- Reward Steps -->
  <rect x="100" y="660" width="180" height="70" fill="#3b82f6" rx="6"/>
  <text x="190" y="685" font-size="12" font-weight="bold" fill="white" text-anchor="middle">1. Analyze</text>
  <text x="190" y="705" font-size="10" fill="#dbeafe" text-anchor="middle">TextBlob</text>
  <text x="190" y="720" font-size="10" fill="#dbeafe" text-anchor="middle">polarity</text>

  <rect x="310" y="660" width="180" height="70" fill="#8b5cf6" rx="6"/>
  <text x="400" y="685" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2. Base Reward</text>
  <text x="400" y="705" font-size="10" fill="#ede9fe" text-anchor="middle">polarity  3.0</text>

  <rect x="520" y="660" width="180" height="70" fill="#10b981" rx="6"/>
  <text x="610" y="685" font-size="12" font-weight="bold" fill="white" text-anchor="middle">3. Bonus</text>
  <text x="610" y="705" font-size="10" fill="#d1fae5" text-anchor="middle">+0.5 if positive</text>

  <rect x="730" y="660" width="180" height="70" fill="#ef4444" rx="6"/>
  <text x="820" y="685" font-size="12" font-weight="bold" fill="white" text-anchor="middle">4. Penalty</text>
  <text x="820" y="705" font-size="10" fill="#fecaca" text-anchor="middle">-1.0 if negative</text>

  <!-- Example -->
  <rect x="100" y="760" width="800" height="120" fill="#0f172a" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="120" y="790" font-size="12" fill="#cbd5e1">Example: "I absolutely love learning new things!"</text>
  <text x="120" y="815" font-size="11" fill="#94a3b8"> Polarity: +0.85</text>
  <text x="120" y="835" font-size="11" fill="#94a3b8"> Base: 0.85  3.0 = 2.55</text>
  <text x="120" y="855" font-size="11" fill="#94a3b8"> Bonus: +0.5 (very positive)</text>
  <text x="120" y="875" font-size="11" fill="#10b981" font-weight="bold"> Final Reward: 3.05 </text>

  <!-- Step 5: Compute Loss -->
  <rect x="350" y="930" width="300" height="60" fill="#8b5cf6" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <text x="500" y="955" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Compute GRPO Loss</text>
  <text x="500" y="975" font-size="11" fill="#ede9fe" text-anchor="middle">Group by reward</text>

  <!-- Step 6: Backprop -->
  <rect x="350" y="1020" width="300" height="60" fill="#8b5cf6" stroke="#a78bfa" stroke-width="2" rx="8"/>
  <text x="500" y="1045" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Backpropagation</text>
  <text x="500" y="1065" font-size="11" fill="#ede9fe" text-anchor="middle">Update weights</text>

  <!-- Decision: More Epochs? -->
  <path d="M 500 1110 L 580 1160 L 500 1210 L 420 1160 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="2"/>
  <text x="500" y="1165" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">More</text>
  <text x="500" y="1180" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">epochs?</text>

  <!-- Step 7: Test -->
  <rect x="700" y="1130" width="200" height="60" fill="#10b981" stroke="#34d399" stroke-width="2" rx="8"/>
  <text x="800" y="1155" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Test Model</text>
  <text x="800" y="1175" font-size="11" fill="#d1fae5" text-anchor="middle">Check sentiment</text>

  <!-- END -->
  <ellipse cx="800" cy="1270" rx="80" ry="40" fill="#10b981" stroke="#34d399" stroke-width="2"/>
  <text x="800" y="1270" font-size="14" font-weight="bold" fill="white" text-anchor="middle">END</text>
  <text x="800" y="1287" font-size="10" fill="#d1fae5" text-anchor="middle">Positive model!</text>

  <!-- Arrows -->
  <line x1="500" y1="130" x2="500" y2="150" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="210" x2="500" y2="240" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="300" x2="500" y2="330" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="390" x2="500" y2="420" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="480" x2="500" y2="510" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="570" x2="500" y2="600" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="900" x2="500" y2="930" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="990" x2="500" y2="1020" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="500" y1="1080" x2="500" y2="1110" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>

  <!-- YES loop back -->
  <line x1="420" y1="1160" x2="300" y2="1160" stroke="#10b981" stroke-width="2"/>
  <line x1="300" y1="1160" x2="300" y2="450" stroke="#10b981" stroke-width="2"/>
  <line x1="300" y1="450" x2="350" y2="450" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <text x="250" y="800" font-size="12" fill="#10b981" font-weight="bold">YES</text>

  <!-- NO to test -->
  <line x1="580" y1="1160" x2="700" y2="1160" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>
  <text x="650" y="1150" font-size="12" fill="#10b981" font-weight="bold">NO</text>

  <!-- Test to END -->
  <line x1="800" y1="1190" x2="800" y2="1230" stroke="#10b981" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Legend -->
  <rect x="50" y="1320" width="900" height="60" fill="#1e293b" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="70" y="1350" font-size="12" fill="#cbd5e1"> Goal: Train model to generate positive, uplifting responses</text>
  <text x="70" y="1370" font-size="11" fill="#94a3b8"> Training time: ~15 minutes on T4 GPU</text>

</svg>