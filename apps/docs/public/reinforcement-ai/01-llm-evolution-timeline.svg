<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1400" height="600" fill="#0f172a"/>

  <!-- Title -->
  <text x="700" y="40" font-size="28" font-weight="bold" fill="#e2e8f0" text-anchor="middle">LLM Evolution Timeline</text>
  <text x="700" y="70" font-size="14" fill="#94a3b8" text-anchor="middle">From GPT-1 to Modern Models</text>

  <!-- Timeline Line -->
  <line x1="100" y1="300" x2="1300" y2="300" stroke="url(#grad1)" stroke-width="4"/>

  <!-- 2018: GPT-1 -->
  <circle cx="150" cy="300" r="12" fill="#3b82f6"/>
  <text x="150" y="250" font-size="16" font-weight="bold" fill="#3b82f6" text-anchor="middle">GPT-1</text>
  <text x="150" y="270" font-size="12" fill="#94a3b8" text-anchor="middle">2018</text>
  <text x="150" y="350" font-size="11" fill="#cbd5e1" text-anchor="middle">117M params</text>

  <!-- 2019: GPT-2 -->
  <circle cx="350" cy="300" r="14" fill="#3b82f6"/>
  <text x="350" y="250" font-size="16" font-weight="bold" fill="#3b82f6" text-anchor="middle">GPT-2</text>
  <text x="350" y="270" font-size="12" fill="#94a3b8" text-anchor="middle">2019</text>
  <text x="350" y="350" font-size="11" fill="#cbd5e1" text-anchor="middle">1.5B params</text>

  <!-- 2020: GPT-3 -->
  <circle cx="550" cy="300" r="18" fill="#6366f1"/>
  <text x="550" y="240" font-size="18" font-weight="bold" fill="#6366f1" text-anchor="middle">GPT-3</text>
  <text x="550" y="260" font-size="12" fill="#94a3b8" text-anchor="middle">2020</text>
  <text x="550" y="350" font-size="11" fill="#cbd5e1" text-anchor="middle">175B params</text>
  <text x="550" y="370" font-size="10" fill="#10b981" text-anchor="middle"> Breakthrough</text>

  <!-- 2022: ChatGPT -->
  <circle cx="800" cy="300" r="22" fill="#8b5cf6"/>
  <text x="800" y="230" font-size="20" font-weight="bold" fill="#8b5cf6" text-anchor="middle">ChatGPT</text>
  <text x="800" y="255" font-size="12" fill="#94a3b8" text-anchor="middle">Nov 2022</text>
  <text x="800" y="360" font-size="11" fill="#cbd5e1" text-anchor="middle">GPT-3.5</text>
  <text x="800" y="380" font-size="10" fill="#f59e0b" text-anchor="middle"> Viral Launch</text>

  <!-- 2023: GPT-4 -->
  <circle cx="1000" cy="300" r="24" fill="#a855f7"/>
  <text x="1000" y="225" font-size="22" font-weight="bold" fill="#a855f7" text-anchor="middle">GPT-4</text>
  <text x="1000" y="250" font-size="12" fill="#94a3b8" text-anchor="middle">Mar 2023</text>
  <text x="1000" y="365" font-size="11" fill="#cbd5e1" text-anchor="middle">Multimodal</text>
  <text x="1000" y="385" font-size="10" fill="#10b981" text-anchor="middle"> SOTA</text>

  <!-- 2024: Modern Era -->
  <circle cx="1250" cy="300" r="20" fill="#ec4899"/>
  <text x="1250" y="235" font-size="18" font-weight="bold" fill="#ec4899" text-anchor="middle">2024+</text>
  <text x="1250" y="255" font-size="12" fill="#94a3b8" text-anchor="middle">Present</text>
  <text x="1250" y="355" font-size="11" fill="#cbd5e1" text-anchor="middle">Open Source</text>
  <text x="1250" y="375" font-size="11" fill="#cbd5e1" text-anchor="middle">Competition</text>

  <!-- Legend -->
  <rect x="100" y="450" width="1200" height="120" fill="#1e293b" stroke="#334155" stroke-width="2" rx="8"/>
  <text x="120" y="480" font-size="14" font-weight="bold" fill="#e2e8f0">Key Milestones:</text>
  <text x="120" y="505" font-size="12" fill="#cbd5e1"> 2018-2019: Foundation models emerge (GPT-1, GPT-2)</text>
  <text x="120" y="525" font-size="12" fill="#cbd5e1"> 2020: Scaling laws proven with GPT-3 (175B parameters)</text>
  <text x="120" y="545" font-size="12" fill="#cbd5e1"> 2022: ChatGPT democratizes AI (100M users in 2 months)</text>
  <text x="750" y="505" font-size="12" fill="#cbd5e1"> 2023: Multimodal capabilities (GPT-4, vision + text)</text>
  <text x="750" y="525" font-size="12" fill="#cbd5e1"> 2024: Open source catches up (Llama, Qwen, Mistral)</text>
</svg>