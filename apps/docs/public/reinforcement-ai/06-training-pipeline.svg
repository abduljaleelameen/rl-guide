<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <rect width="1200" height="600" fill="#0f172a"/>
  <text x="600" y="35" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Complete LLM Training Pipeline</text>

  <rect x="100" y="100" width="200" height="80" fill="#3b82f6" rx="8"/>
  <text x="200" y="135" font-size="14" font-weight="bold" fill="white" text-anchor="middle">1. Pre-training</text>
  <text x="200" y="160" font-size="11" fill="#dbeafe" text-anchor="middle">Learn language</text>

  <rect x="350" y="100" width="200" height="80" fill="#f59e0b" rx="8"/>
  <text x="450" y="135" font-size="14" font-weight="bold" fill="white" text-anchor="middle">2. SFT</text>
  <text x="450" y="160" font-size="11" fill="#fef3c7" text-anchor="middle">Task-specific</text>

  <rect x="600" y="100" width="200" height="80" fill="#10b981" rx="8"/>
  <text x="700" y="135" font-size="14" font-weight="bold" fill="white" text-anchor="middle">3. Reward Model</text>
  <text x="700" y="160" font-size="11" fill="#d1fae5" text-anchor="middle">Learn preferences</text>

  <rect x="850" y="100" width="200" height="80" fill="#8b5cf6" rx="8"/>
  <text x="950" y="135" font-size="14" font-weight="bold" fill="white" text-anchor="middle">4. RL (PPO/GRPO)</text>
  <text x="950" y="160" font-size="11" fill="#ede9fe" text-anchor="middle">Optimize behavior</text>

  <!-- Arrows -->
  <path d="M 300 140 L 350 140" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 550 140 L 600 140" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 800 140 L 850 140" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981" />
    </marker>
  </defs>

  <!-- Details -->
  <rect x="100" y="250" width="1000" height="300" fill="#1e293b" stroke="#334155" stroke-width="2" rx="10"/>
  <text x="600" y="290" font-size="18" fill="#e2e8f0" font-weight="bold" text-anchor="middle">What Each Stage Does:</text>

  <text x="130" y="330" font-size="13" fill="#3b82f6" font-weight="bold">Pre-training (Months, $M-100M):</text>
  <text x="150" y="355" font-size="12" fill="#cbd5e1">Learn grammar, facts, reasoning from trillions of tokens</text>

  <text x="130" y="395" font-size="13" fill="#f59e0b" font-weight="bold">Supervised Fine-Tuning (Days, $1K-10K):</text>
  <text x="150" y="420" font-size="12" fill="#cbd5e1">Learn specific format (e.g., chat, code, Q&A)</text>

  <text x="130" y="460" font-size="13" fill="#10b981" font-weight="bold">Reward Modeling (Days, $1K-5K):</text>
  <text x="150" y="485" font-size="12" fill="#cbd5e1">Train model to score output quality (human preferences)</text>

  <text x="130" y="525" font-size="13" fill="#8b5cf6" font-weight="bold">RL Training (Hours-Days, $100-1K):</text>
  <text x="150" y="550" font-size="12" fill="#cbd5e1">Optimize model to maximize rewards (this course!)</text>
</svg>