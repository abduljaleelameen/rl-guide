<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800">
  <rect width="1400" height="800" fill="#0f172a"/>
  <text x="700" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">3 Stages of Model Training</text>

  <rect x="100" y="120" width="350" height="550" fill="#1e293b" stroke="#3b82f6" stroke-width="3" rx="10"/>
  <text x="275" y="165" font-size="20" fill="#3b82f6" font-weight="bold" text-anchor="middle">Stage 1: Pre-training</text>
  <text x="130" y="210" font-size="13" fill="#cbd5e1">Data: Trillions of tokens</text>
  <text x="130" y="240" font-size="13" fill="#cbd5e1">Goal: Learn language</text>
  <text x="130" y="270" font-size="13" fill="#cbd5e1">Time: Months</text>
  <text x="130" y="300" font-size="13" fill="#cbd5e1">Cost: $1M-100M</text>
  <text x="130" y="340" font-size="12" fill="#94a3b8">Output: Base model</text>
  <rect x="130" y="370" width="280" height="260" fill="#0f172a" rx="6"/>
  <text x="270" y="400" font-size="11" fill="#64748b" text-anchor="middle">Can complete text but</text>
  <text x="270" y="420" font-size="11" fill="#64748b" text-anchor="middle">doesn't follow instructions</text>
  <text x="145" y="460" font-size="11" fill="#cbd5e1">Prompt: "What is 2+2?"</text>
  <text x="145" y="485" font-size="11" fill="#ef4444">Bad response: "What is</text>
  <text x="145" y="505" font-size="11" fill="#ef4444">3+3? What is 4+4..."</text>
  <text x="145" y="545" font-size="10" fill="#64748b" font-style="italic">(Just continues pattern,</text>
  <text x="145" y="565" font-size="10" fill="#64748b" font-style="italic">doesn't answer!)</text>

  <rect x="525" y="120" width="350" height="550" fill="#1e293b" stroke="#f59e0b" stroke-width="3" rx="10"/>
  <text x="700" y="165" font-size="20" fill="#f59e0b" font-weight="bold" text-anchor="middle">Stage 2: Fine-tuning</text>
  <text x="555" y="210" font-size="13" fill="#cbd5e1">Data: 10K-1M examples</text>
  <text x="555" y="240" font-size="13" fill="#cbd5e1">Goal: Learn task format</text>
  <text x="555" y="270" font-size="13" fill="#cbd5e1">Time: Hours-Days</text>
  <text x="555" y="300" font-size="13" fill="#cbd5e1">Cost: $100-10K</text>
  <text x="555" y="340" font-size="12" fill="#94a3b8">Output: Instruct model</text>
  <rect x="555" y="370" width="280" height="260" fill="#0f172a" rx="6"/>
  <text x="695" y="400" font-size="11" fill="#64748b" text-anchor="middle">Follows instructions</text>
  <text x="695" y="420" font-size="11" fill="#64748b" text-anchor="middle">but not optimized</text>
  <text x="570" y="460" font-size="11" fill="#cbd5e1">Prompt: "What is 2+2?"</text>
  <text x="570" y="485" font-size="11" fill="#fbbf24">Better: "The answer to</text>
  <text x="570" y="505" font-size="11" fill="#fbbf24">2+2 is 4."</text>
  <text x="570" y="545" font-size="10" fill="#64748b" font-style="italic">(Correct, but verbose)</text>

  <rect x="950" y="120" width="350" height="550" fill="#1e293b" stroke="#10b981" stroke-width="3" rx="10"/>
  <text x="1125" y="165" font-size="20" fill="#10b981" font-weight="bold" text-anchor="middle">Stage 3: RL (THIS!)</text>
  <text x="980" y="210" font-size="13" fill="#cbd5e1">Data: Reward function</text>
  <text x="980" y="240" font-size="13" fill="#cbd5e1">Goal: Optimize behavior</text>
  <text x="980" y="270" font-size="13" fill="#cbd5e1">Time: Hours</text>
  <text x="980" y="300" font-size="13" fill="#cbd5e1">Cost: $10-1K</text>
  <text x="980" y="340" font-size="12" fill="#94a3b8">Output: Optimized model</text>
  <rect x="980" y="370" width="280" height="260" fill="#0f172a" rx="6"/>
  <text x="1120" y="400" font-size="11" fill="#64748b" text-anchor="middle">Maximizes rewards:</text>
  <text x="1120" y="420" font-size="11" fill="#64748b" text-anchor="middle">concise + correct</text>
  <text x="995" y="460" font-size="11" fill="#cbd5e1">Prompt: "What is 2+2?"</text>
  <text x="995" y="485" font-size="11" fill="#10b981">Best: "4"</text>
  <text x="995" y="525" font-size="10" fill="#64748b" font-style="italic">(Perfect! Concise and</text>
  <text x="995" y="545" font-size="10" fill="#64748b" font-style="italic">correct)</text>

  <rect x="100" y="710" width="1200" height="60" fill="#10b981" rx="8"/>
  <text x="700" y="750" font-size="16" font-weight="bold" fill="white" text-anchor="middle"> You start with a pre-trained + fine-tuned model, then add RL to customize it!</text>
</svg>