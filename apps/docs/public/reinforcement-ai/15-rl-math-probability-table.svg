<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">RL Math: Probability Distribution</text>

  <rect x="100" y="100" width="1000" height="500" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="600" y="145" font-size="18" fill="#10b981" font-weight="bold" text-anchor="middle">Example: Model choosing next word</text>

  <!-- Table -->
  <rect x="150" y="180" width="900" height="40" fill="#334155"/>
  <text x="200" y="207" font-size="14" fill="#e2e8f0" font-weight="bold">Word</text>
  <text x="400" y="207" font-size="14" fill="#e2e8f0" font-weight="bold">Probability</text>
  <text x="650" y="207" font-size="14" fill="#e2e8f0" font-weight="bold">After RL</text>

  <rect x="150" y="220" width="900" height="50" fill="#0f172a"/>
  <text x="200" y="250" font-size="13" fill="#10b981">"correct"</text>
  <text x="400" y="250" font-size="13" fill="#cbd5e1">0.30</text>
  <text x="650" y="250" font-size="13" fill="#10b981">0.65 </text>

  <rect x="150" y="270" width="900" height="50" fill="#0f172a"/>
  <text x="200" y="300" font-size="13" fill="#cbd5e1">"good"</text>
  <text x="400" y="300" font-size="13" fill="#cbd5e1">0.25</text>
  <text x="650" y="300" font-size="13" fill="#fbbf24">0.20 </text>

  <rect x="150" y="320" width="900" height="50" fill="#0f172a"/>
  <text x="200" y="350" font-size="13" fill="#cbd5e1">"wrong"</text>
  <text x="400" y="350" font-size="13" fill="#cbd5e1">0.25</text>
  <text x="650" y="350" font-size="13" fill="#ef4444">0.10 </text>

  <rect x="150" y="370" width="900" height="50" fill="#0f172a"/>
  <text x="200" y="400" font-size="13" fill="#cbd5e1">"other"</text>
  <text x="400" y="400" font-size="13" fill="#cbd5e1">0.20</text>
  <text x="650" y="400" font-size="13" fill="#94a3b8">0.05 </text>

  <text x="150" y="470" font-size="14" fill="#10b981" font-weight="bold"> RL increases probability of high-reward words!</text>
  <text x="170" y="505" font-size="12" fill="#cbd5e1">Before training: Model uncertain (spread probabilities)</text>
  <text x="170" y="530" font-size="12" fill="#cbd5e1">After RL: Model confident in best answer (concentrated probability)</text>
</svg>