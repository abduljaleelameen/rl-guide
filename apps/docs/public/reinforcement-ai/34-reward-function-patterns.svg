<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000">
  <rect width="1400" height="1000" fill="#0f172a"/>
  <text x="700" y="40" font-size="28" font-weight="bold" fill="#e2e8f0" text-anchor="middle">6 Common Reward Function Patterns</text>

  <!-- Pattern boxes in 2x3 grid -->
  <rect x="70" y="100" width="400" height="250" fill="#1e293b" stroke="#10b981" stroke-width="3" rx="10"/>
  <text x="270" y="140" font-size="18" font-weight="bold" fill="#10b981" text-anchor="middle">Binary</text>
  <text x="90" y="175" font-size="13" fill="#cbd5e1">Right or wrong</text>
  <text x="110" y="205" font-size="12" fill="#10b981">Correct: +1</text>
  <text x="110" y="230" font-size="12" fill="#ef4444">Wrong: -1</text>
  <text x="90" y="265" font-size="11" fill="#94a3b8">Best for: Classification</text>
  <rect x="100" y="290" width="340" height="40" fill="#0f172a" rx="6"/>
  <text x="270" y="315" font-size="10" fill="#64748b" text-anchor="middle">if correct: return 1.0 else: return -1.0</text>

  <rect x="500" y="100" width="400" height="250" fill="#1e293b" stroke="#f59e0b" stroke-width="3" rx="10"/>
  <text x="700" y="140" font-size="18" font-weight="bold" fill="#f59e0b" text-anchor="middle">Graduated</text>
  <text x="520" y="175" font-size="13" fill="#cbd5e1">Tiered scoring</text>
  <text x="540" y="205" font-size="12" fill="#10b981">Perfect: +3.0</text>
  <text x="540" y="230" font-size="12" fill="#fbbf24">Close: +1.5</text>
  <text x="540" y="255" font-size="12" fill="#ef4444">Wrong: 0.0</text>
  <rect x="530" y="280" width="340" height="50" fill="#0f172a" rx="6"/>
  <text x="700" y="305" font-size="10" fill="#64748b" text-anchor="middle">if error &lt; 10%: return 3.0</text>
  <text x="700" y="320" font-size="10" fill="#64748b" text-anchor="middle">elif error &lt; 25%: return 1.5</text>

  <rect x="930" y="100" width="400" height="250" fill="#1e293b" stroke="#8b5cf6" stroke-width="3" rx="10"/>
  <text x="1130" y="140" font-size="18" font-weight="bold" fill="#8b5cf6" text-anchor="middle">Continuous</text>
  <text x="950" y="175" font-size="13" fill="#cbd5e1">Smooth function</text>
  <text x="970" y="205" font-size="12" fill="#cbd5e1">Gaussian curve</text>
  <text x="970" y="230" font-size="12" fill="#cbd5e1">Exponential decay</text>
  <rect x="960" y="260" width="340" height="70" fill="#0f172a" rx="6"/>
  <text x="1130" y="285" font-size="10" fill="#64748b" text-anchor="middle">reward = e^(-(distance)/(2))</text>
  <text x="1130" y="305" font-size="10" fill="#64748b" text-anchor="middle">or</text>
  <text x="1130" y="320" font-size="10" fill="#64748b" text-anchor="middle">reward = e^(-distance/)</text>

  <rect x="70" y="400" width="400" height="250" fill="#1e293b" stroke="#3b82f6" stroke-width="3" rx="10"/>
  <text x="270" y="440" font-size="18" font-weight="bold" fill="#3b82f6" text-anchor="middle">Rule-Based</text>
  <text x="90" y="475" font-size="13" fill="#cbd5e1">Multiple criteria</text>
  <text x="110" y="505" font-size="11" fill="#10b981">+1.0 has answer</text>
  <text x="110" y="525" font-size="11" fill="#f59e0b">+0.5 good length</text>
  <text x="110" y="545" font-size="11" fill="#8b5cf6">+0.3 polite</text>
  <text x="110" y="565" font-size="11" fill="#ef4444">-2.0 harmful</text>
  <rect x="100" y="585" width="340" height="45" fill="#0f172a" rx="6"/>
  <text x="270" y="612" font-size="10" fill="#64748b" text-anchor="middle">total = sum(all_bonuses_penalties)</text>

  <rect x="500" y="400" width="400" height="250" fill="#1e293b" stroke="#ec4899" stroke-width="3" rx="10"/>
  <text x="700" y="440" font-size="18" font-weight="bold" fill="#ec4899" text-anchor="middle">Model-Based</text>
  <text x="520" y="475" font-size="13" fill="#cbd5e1">LLM-as-judge</text>
  <text x="540" y="505" font-size="12" fill="#cbd5e1">Use GPT-4/Claude</text>
  <text x="540" y="530" font-size="12" fill="#cbd5e1">to score output</text>
  <text x="540" y="555" font-size="11" fill="#10b981">Pro: Nuanced</text>
  <text x="540" y="577" font-size="11" fill="#ef4444">Con: Expensive</text>
  <rect x="530" y="595" width="340" height="40" fill="#0f172a" rx="6"/>
  <text x="700" y="620" font-size="10" fill="#64748b" text-anchor="middle">score = llm.evaluate(output, criteria)</text>

  <rect x="930" y="400" width="400" height="250" fill="#1e293b" stroke="#06b6d4" stroke-width="3" rx="10"/>
  <text x="1130" y="440" font-size="18" font-weight="bold" fill="#06b6d4" text-anchor="middle">Hybrid</text>
  <text x="950" y="475" font-size="13" fill="#cbd5e1">Weighted combo</text>
  <text x="970" y="505" font-size="11" fill="#cbd5e1">correctness  0.40</text>
  <text x="970" y="525" font-size="11" fill="#cbd5e1">+ concise  0.25</text>
  <text x="970" y="545" font-size="11" fill="#cbd5e1">+ clarity  0.20</text>
  <text x="970" y="565" font-size="11" fill="#cbd5e1">+ tone  0.15</text>
  <rect x="960" y="585" width="340" height="50" fill="#0f172a" rx="6"/>
  <text x="1130" y="605" font-size="10" fill="#64748b" text-anchor="middle">total = (metric_i  weight_i)</text>
  <text x="1130" y="625" font-size="10" fill="#64748b" text-anchor="middle">where weights = 1.0</text>

  <!-- Bottom recommendation -->
  <rect x="70" y="700" width="1260" height="250" fill="#1e293b" stroke="#10b981" stroke-width="3" rx="12"/>
  <text x="700" y="745" font-size="22" font-weight="bold" fill="#10b981" text-anchor="middle"> Which Pattern to Use?</text>

  <text x="100" y="790" font-size="14" fill="#cbd5e1"> <text fill="#10b981" font-weight="bold">Binary:</text> Simple yes/no tasks (classification, fact-checking)</text>
  <text x="100" y="820" font-size="14" fill="#cbd5e1"> <text fill="#f59e0b" font-weight="bold">Graduated:</text> Math problems, numerical estimation (partial credit matters)</text>
  <text x="100" y="850" font-size="14" fill="#cbd5e1"> <text fill="#8b5cf6" font-weight="bold">Continuous:</text> Length control, proximity tasks (smooth optimization)</text>
  <text x="100" y="880" font-size="14" fill="#cbd5e1"> <text fill="#3b82f6" font-weight="bold">Rule-Based:</text> Content moderation, multi-criteria (explicit rules)</text>
  <text x="100" y="910" font-size="14" fill="#cbd5e1"> <text fill="#ec4899" font-weight="bold">Model-Based:</text> Complex quality (when rules hard to define)</text>
  <text x="100" y="940" font-size="14" fill="#cbd5e1"> <text fill="#06b6d4" font-weight="bold">Hybrid:</text> Production systems (balance multiple objectives)</text>

</svg>