<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Weight Space Optimization</text>
  <text x="600" y="70" font-size="14" fill="#94a3b8" text-anchor="middle">How RL Updates Model Weights</text>

  <!-- 3D-like visualization -->
  <ellipse cx="600" cy="350" rx="400" ry="250" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Starting point -->
  <circle cx="400" cy="250" r="15" fill="#3b82f6"/>
  <text x="400" y="230" font-size="14" fill="#3b82f6" font-weight="bold" text-anchor="middle">Start</text>
  <text x="400" y="290" font-size="11" fill="#94a3b8" text-anchor="middle">(Fine-tuned model)</text>

  <!-- Path showing optimization -->
  <path d="M 400 250 Q 500 280, 600 320 T 750 380" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="10,5"/>

  <!-- Optimal point -->
  <circle cx="750" cy="380" r="20" fill="#10b981"/>
  <text x="750" y="360" font-size="16" fill="#10b981" font-weight="bold" text-anchor="middle">Optimal</text>
  <text x="750" y="430" font-size="11" fill="#d1fae5" text-anchor="middle">(High rewards!)</text>

  <!-- Local minimum -->
  <circle cx="550" cy="450" r="12" fill="#ef4444"/>
  <text x="550" y="480" font-size="12" fill="#ef4444" text-anchor="middle">Local min</text>

  <rect x="100" y="550" width="1000" height="120" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="600" y="590" font-size="16" fill="#10b981" font-weight="bold" text-anchor="middle">How RL Optimization Works:</text>
  <text x="130" y="625" font-size="13" fill="#cbd5e1">1. Start from fine-tuned weights</text>
  <text x="130" y="650" font-size="13" fill="#cbd5e1">2. Generate outputs, get rewards</text>
  <text x="650" y="625" font-size="13" fill="#cbd5e1">3. Adjust weights toward high rewards</text>
  <text x="650" y="650" font-size="13" fill="#cbd5e1">4. Repeat until convergence</text>
</svg>