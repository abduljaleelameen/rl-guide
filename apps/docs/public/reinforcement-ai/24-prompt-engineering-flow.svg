<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800">
  <rect width="1000" height="800" fill="#0f172a"/>
  <text x="500" y="35" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Custom Tag Validation Flow</text>

  <ellipse cx="500" cy="100" rx="80" ry="40" fill="#3b82f6" stroke="#60a5fa" stroke-width="2"/>
  <text x="500" y="108" font-size="14" fill="white" text-anchor="middle">Model Output</text>

  <rect x="350" y="180" width="300" height="70" fill="#8b5cf6" rx="8"/>
  <text x="500" y="210" font-size="13" fill="white" text-anchor="middle" font-weight="bold">Search for Tags</text>
  <text x="500" y="230" font-size="11" fill="#ede9fe" text-anchor="middle" font-family="monospace">&lt;thinking&gt;...&lt;/thinking&gt;</text>

  <path d="M 500 280 L 350 350" stroke="#10b981" stroke-width="2"/>
  <path d="M 500 280 L 650 350" stroke="#10b981" stroke-width="2"/>

  <rect x="120" y="350" width="200" height="60" fill="#10b981" rx="8"/>
  <text x="220" y="375" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Has &lt;thinking&gt;</text>
  <text x="220" y="395" font-size="11" fill="#d1fae5" text-anchor="middle"></text>

  <rect x="680" y="350" width="200" height="60" fill="#10b981" rx="8"/>
  <text x="780" y="375" font-size="12" fill="white" text-anchor="middle" font-weight="bold">Has &lt;answer&gt;</text>
  <text x="780" y="395" font-size="11" fill="#d1fae5" text-anchor="middle"></text>

  <path d="M 220 410 L 500 500" stroke="#10b981" stroke-width="2"/>
  <path d="M 780 410 L 500 500" stroke="#10b981" stroke-width="2"/>

  <rect x="350" y="500" width="300" height="70" fill="#10b981" rx="8"/>
  <text x="500" y="530" font-size="14" fill="white" text-anchor="middle" font-weight="bold">BOTH TAGS!</text>
  <text x="500" y="550" font-size="12" fill="#d1fae5" text-anchor="middle">Base reward = 3.0</text>

  <rect x="350" y="600" width="300" height="140" fill="#1e293b" stroke="#10b981" stroke-width="2" rx="8"/>
  <text x="500" y="630" font-size="13" fill="#10b981" font-weight="bold" text-anchor="middle">Quality Bonuses:</text>
  <text x="380" y="660" font-size="11" fill="#cbd5e1"> Correct order: +0.3</text>
  <text x="380" y="685" font-size="11" fill="#cbd5e1"> 2 sentences in thinking: +0.2</text>
  <text x="380" y="710" font-size="11" fill="#cbd5e1"> Answer 5-30 words: +0.2</text>

  <rect x="100" y="100" width="200" height="80" fill="#ef4444" opacity="0.3" rx="8"/>
  <text x="200" y="135" font-size="12" fill="#ef4444" font-weight="bold" text-anchor="middle">No tags found</text>
  <text x="200" y="155" font-size="11" fill="#ef4444" text-anchor="middle">reward = -1.0</text>

  <rect x="700" y="100" width="200" height="80" fill="#fbbf24" opacity="0.3" rx="8"/>
  <text x="800" y="135" font-size="12" fill="#fbbf24" font-weight="bold" text-anchor="middle">Only one tag</text>
  <text x="800" y="155" font-size="11" fill="#fbbf24" text-anchor="middle">reward = 1.0</text>
</svg>