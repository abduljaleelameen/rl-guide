<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1300">
  <rect width="1200" height="1300" fill="#0f172a"/>
  <text x="600" y="35" font-size="24" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Flowchart: Production Pipeline (example8.py)</text>

  <!-- Start -->
  <ellipse cx="600" cy="90" rx="70" ry="35" fill="#10b981" stroke="#34d399" stroke-width="2"/>
  <text x="600" y="98" font-size="14" fill="white" text-anchor="middle" font-weight="bold">START</text>

  <path d="M 600 125 L 600 160" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 1: Development -->
  <rect x="100" y="160" width="1000" height="180" fill="#1e293b" stroke="#3b82f6" stroke-width="3" rx="10"/>
  <text x="600" y="195" font-size="18" fill="#3b82f6" font-weight="bold" text-anchor="middle">PHASE 1: DEVELOPMENT</text>

  <rect x="130" y="220" width="300" height="100" fill="#0f172a" stroke="#3b82f6" stroke-width="2" rx="6"/>
  <text x="280" y="250" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="bold">1. Train RL Policy</text>
  <text x="160" y="275" font-size="11" fill="#cbd5e1"> Design reward function</text>
  <text x="160" y="295" font-size="11" fill="#cbd5e1"> Train with GRPO</text>
  <text x="160" y="315" font-size="11" fill="#10b981"> Converged model</text>

  <rect x="450" y="220" width="300" height="100" fill="#0f172a" stroke="#3b82f6" stroke-width="2" rx="6"/>
  <text x="600" y="250" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="bold">2. Validate</text>
  <text x="480" y="275" font-size="11" fill="#cbd5e1"> Test on held-out set</text>
  <text x="480" y="295" font-size="11" fill="#cbd5e1"> Human evaluation</text>
  <text x="480" y="315" font-size="11" fill="#10b981"> Quality checked</text>

  <rect x="770" y="220" width="300" height="100" fill="#0f172a" stroke="#3b82f6" stroke-width="2" rx="6"/>
  <text x="920" y="250" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="bold">3. Package Model</text>
  <text x="800" y="275" font-size="11" fill="#cbd5e1"> Save checkpoint</text>
  <text x="800" y="295" font-size="11" fill="#cbd5e1"> Create deployment artifact</text>
  <text x="800" y="315" font-size="11" fill="#10b981"> Ready to deploy</text>

  <path d="M 600 340 L 600 380" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 2: Canary -->
  <rect x="100" y="380" width="1000" height="180" fill="#1e293b" stroke="#fbbf24" stroke-width="3" rx="10"/>
  <text x="600" y="415" font-size="18" fill="#fbbf24" font-weight="bold" text-anchor="middle">PHASE 2: CANARY DEPLOYMENT (5% Traffic)</text>

  <rect x="130" y="440" width="300" height="100" fill="#0f172a" stroke="#fbbf24" stroke-width="2" rx="6"/>
  <text x="280" y="470" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="bold">4. Deploy to Subset</text>
  <text x="160" y="495" font-size="11" fill="#cbd5e1"> 5% of production traffic</text>
  <text x="160" y="515" font-size="11" fill="#cbd5e1"> A/B test infrastructure</text>
  <text x="160" y="535" font-size="11" fill="#fbbf24"> Monitor closely</text>

  <rect x="450" y="440" width="300" height="100" fill="#0f172a" stroke="#fbbf24" stroke-width="2" rx="6"/>
  <text x="600" y="470" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="bold">5. Monitor Metrics</text>
  <text x="480" y="495" font-size="11" fill="#cbd5e1"> Average reward</text>
  <text x="480" y="515" font-size="11" fill="#cbd5e1"> Response quality</text>
  <text x="480" y="535" font-size="11" fill="#cbd5e1"> Latency &amp; errors</text>

  <rect x="770" y="440" width="300" height="100" fill="#0f172a" stroke="#fbbf24" stroke-width="2" rx="6"/>
  <text x="920" y="470" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="bold">6. Compare Baseline</text>
  <text x="800" y="495" font-size="11" fill="#10b981"> New model better?</text>
  <text x="820" y="515" font-size="11" fill="#10b981"> Proceed to full rollout</text>
  <text x="800" y="535" font-size="11" fill="#ef4444"> Issues detected?</text>

  <!-- Decision Point -->
  <path d="M 600 560 L 600 600" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 920 540 L 1120 540 L 1120 680 L 1100 680" stroke="#ef4444" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,5"/>
  <text x="1140" y="610" font-size="11" fill="#ef4444" font-weight="bold">Rollback</text>

  <!-- Phase 3: Full Deployment -->
  <rect x="100" y="600" width="1000" height="180" fill="#1e293b" stroke="#10b981" stroke-width="3" rx="10"/>
  <text x="600" y="635" font-size="18" fill="#10b981" font-weight="bold" text-anchor="middle">PHASE 3: FULL DEPLOYMENT (100% Traffic)</text>

  <rect x="130" y="660" width="300" height="100" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
  <text x="280" y="690" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="bold">7. Roll Out</text>
  <text x="160" y="715" font-size="11" fill="#cbd5e1"> Gradual increase to 100%</text>
  <text x="160" y="735" font-size="11" fill="#10b981"> Canary successful</text>
  <text x="160" y="755" font-size="11" fill="#10b981"> Full traffic migrated</text>

  <rect x="450" y="660" width="300" height="100" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
  <text x="600" y="690" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="bold">8. Monitor Production</text>
  <text x="480" y="715" font-size="11" fill="#cbd5e1"> Continuous metrics</text>
  <text x="480" y="735" font-size="11" fill="#cbd5e1"> User feedback</text>
  <text x="480" y="755" font-size="11" fill="#cbd5e1"> Alert on regressions</text>

  <rect x="770" y="660" width="300" height="100" fill="#0f172a" stroke="#10b981" stroke-width="2" rx="6"/>
  <text x="920" y="690" font-size="13" fill="#cbd5e1" text-anchor="middle" font-weight="bold">9. Iterate</text>
  <text x="800" y="715" font-size="11" fill="#cbd5e1"> Collect production data</text>
  <text x="800" y="735" font-size="11" fill="#cbd5e1"> Fine-tune further</text>
  <text x="800" y="755" font-size="11" fill="#10b981"> Continuous improvement</text>

  <path d="M 600 780 L 600 820" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Phase 4: Monitoring -->
  <rect x="100" y="820" width="1000" height="200" fill="#1e293b" stroke="#8b5cf6" stroke-width="3" rx="10"/>
  <text x="600" y="855" font-size="18" fill="#8b5cf6" font-weight="bold" text-anchor="middle">PHASE 4: CONTINUOUS MONITORING</text>

  <text x="130" y="890" font-size="13" fill="#cbd5e1" font-weight="bold">Track Key Metrics:</text>
  <text x="160" y="915" font-size="12" fill="#cbd5e1"> Average reward (should remain stable)</text>
  <text x="160" y="940" font-size="12" fill="#cbd5e1"> Response quality (human eval scores)</text>
  <text x="160" y="965" font-size="12" fill="#cbd5e1"> Latency &amp; throughput</text>
  <text x="160" y="990" font-size="12" fill="#cbd5e1"> Error rates &amp; failure modes</text>

  <text x="650" y="890" font-size="13" fill="#ef4444" font-weight="bold">Alert Conditions:</text>
  <text x="680" y="915" font-size="12" fill="#ef4444"> Reward drops &gt;10%</text>
  <text x="680" y="940" font-size="12" fill="#ef4444"> Quality regression detected</text>
  <text x="680" y="965" font-size="12" fill="#ef4444"> Latency spike (&gt;2x baseline)</text>
  <text x="680" y="990" font-size="12" fill="#ef4444"> Automatic rollback triggered</text>

  <path d="M 600 1020 L 600 1060" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rollback Strategy -->
  <rect x="100" y="1060" width="1000" height="120" fill="#1e293b" stroke="#ef4444" stroke-width="3" rx="10"/>
  <text x="600" y="1095" font-size="18" fill="#ef4444" font-weight="bold" text-anchor="middle"> ROLLBACK STRATEGY</text>
  <text x="130" y="1130" font-size="12" fill="#cbd5e1">If issues detected at any phase:</text>
  <text x="160" y="1155" font-size="12" fill="#cbd5e1">1. Revert to previous stable version immediately</text>
  <text x="160" y="1175" font-size="12" fill="#cbd5e1">2. Investigate root cause (reward hacking, distribution shift, edge cases)</text>

  <path d="M 600 1180 L 600 1220" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Success -->
  <rect x="200" y="1220" width="800" height="60" fill="#10b981" rx="10"/>
  <text x="600" y="1258" font-size="16" font-weight="bold" fill="white" text-anchor="middle"> PRODUCTION RL MODEL SUCCESSFULLY DEPLOYED</text>

  <path d="M 600 1280 L 600 1292" stroke="#10b981" stroke-width="2"/>

  <!-- End -->
  <ellipse cx="600" cy="1292" rx="60" ry="8" fill="#ef4444" stroke="#f87171" stroke-width="2"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#10b981"/>
    </marker>
  </defs>
</svg>
