<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Open vs Closed Source Models</text>

  <rect x="100" y="100" width="450" height="500" fill="#1e293b" stroke="#ef4444" stroke-width="3" rx="10"/>
  <text x="325" y="150" font-size="20" font-weight="bold" fill="#ef4444" text-anchor="middle">Closed Source</text>
  <text x="130" y="190" font-size="14" fill="#cbd5e1">Examples: GPT-4, Claude</text>
  <text x="150" y="230" font-size="13" fill="#10b981"> Best performance</text>
  <text x="150" y="260" font-size="13" fill="#10b981"> Regular updates</text>
  <text x="150" y="290" font-size="13" fill="#10b981"> Safety guardrails</text>
  <text x="150" y="330" font-size="13" fill="#ef4444"> API costs add up</text>
  <text x="150" y="360" font-size="13" fill="#ef4444"> No customization</text>
  <text x="150" y="390" font-size="13" fill="#ef4444"> Data privacy concerns</text>
  <text x="150" y="420" font-size="13" fill="#ef4444"> Rate limits</text>
  <rect x="130" y="460" width="370" height="110" fill="#0f172a" rx="6"/>
  <text x="315" y="490" font-size="12" fill="#94a3b8" text-anchor="middle">Best for: Quick prototypes,</text>
  <text x="315" y="510" font-size="12" fill="#94a3b8" text-anchor="middle">low-volume apps, when you</text>
  <text x="315" y="530" font-size="12" fill="#94a3b8" text-anchor="middle">need cutting-edge performance</text>
  <text x="315" y="555" font-size="11" fill="#64748b" font-style="italic" text-anchor="middle">Cost: $0.01-0.10 per 1K tokens</text>

  <rect x="650" y="100" width="450" height="500" fill="#1e293b" stroke="#10b981" stroke-width="3" rx="10"/>
  <text x="875" y="150" font-size="20" font-weight="bold" fill="#10b981" text-anchor="middle">Open Source</text>
  <text x="680" y="190" font-size="14" fill="#cbd5e1">Examples: Llama, Qwen, Mistral</text>
  <text x="700" y="230" font-size="13" fill="#10b981"> Free to use</text>
  <text x="700" y="260" font-size="13" fill="#10b981"> Full customization</text>
  <text x="700" y="290" font-size="13" fill="#10b981"> Data stays private</text>
  <text x="700" y="320" font-size="13" fill="#10b981"> No rate limits</text>
  <text x="700" y="360" font-size="13" fill="#fbbf24"> Need GPU infrastructure</text>
  <text x="700" y="390" font-size="13" fill="#fbbf24"> Setup complexity</text>
  <text x="700" y="420" font-size="13" fill="#fbbf24"> You handle safety</text>
  <rect x="680" y="460" width="370" height="110" fill="#0f172a" rx="6"/>
  <text x="865" y="490" font-size="12" fill="#94a3b8" text-anchor="middle">Best for: High-volume apps,</text>
  <text x="865" y="510" font-size="12" fill="#94a3b8" text-anchor="middle">custom training, data privacy,</text>
  <text x="865" y="530" font-size="12" fill="#94a3b8" text-anchor="middle">production deployments</text>
  <text x="865" y="555" font-size="11" fill="#64748b" font-style="italic" text-anchor="middle">Cost: GPU hosting (~$1-5/hr)</text>

  <rect x="100" y="630" width="1000" height="50" fill="#10b981" rx="8"/>
  <text x="600" y="662" font-size="16" font-weight="bold" fill="white" text-anchor="middle"> This course uses Open Source (Qwen, Llama) for full control and customization!</text>
</svg>