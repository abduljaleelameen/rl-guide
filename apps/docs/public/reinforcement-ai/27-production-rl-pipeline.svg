<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#0f172a"/>
  <text x="600" y="40" font-size="26" font-weight="bold" fill="#e2e8f0" text-anchor="middle">Production RL Pipeline</text>

  <!-- Development Phase -->
  <rect x="50" y="100" width="350" height="200" fill="#1e293b" stroke="#3b82f6" stroke-width="3" rx="10"/>
  <text x="225" y="140" font-size="18" fill="#3b82f6" font-weight="bold" text-anchor="middle">1. Development</text>
  <text x="80" y="175" font-size="13" fill="#cbd5e1"> Train policy model</text>
  <text x="80" y="200" font-size="13" fill="#cbd5e1"> Design reward function</text>
  <text x="80" y="225" font-size="13" fill="#cbd5e1"> Validate on dev set</text>
  <text x="80" y="250" font-size="13" fill="#cbd5e1"> Tune hyperparameters</text>
  <text x="80" y="275" font-size="13" fill="#10b981"> Goal: High reward scores</text>

  <!-- Canary Deployment -->
  <rect x="425" y="100" width="350" height="200" fill="#1e293b" stroke="#fbbf24" stroke-width="3" rx="10"/>
  <text x="600" y="140" font-size="18" fill="#fbbf24" font-weight="bold" text-anchor="middle">2. Canary (5% traffic)</text>
  <text x="455" y="175" font-size="13" fill="#cbd5e1"> Deploy to 5% users</text>
  <text x="455" y="200" font-size="13" fill="#cbd5e1"> Monitor key metrics</text>
  <text x="455" y="225" font-size="13" fill="#cbd5e1"> Compare to baseline</text>
  <text x="455" y="250" font-size="13" fill="#cbd5e1"> Watch for regressions</text>
  <text x="455" y="275" font-size="13" fill="#10b981"> Safe rollout</text>

  <!-- Full Deployment -->
  <rect x="800" y="100" width="350" height="200" fill="#1e293b" stroke="#10b981" stroke-width="3" rx="10"/>
  <text x="975" y="140" font-size="18" fill="#10b981" font-weight="bold" text-anchor="middle">3. Full Deployment</text>
  <text x="830" y="175" font-size="13" fill="#cbd5e1"> Roll out to 100%</text>
  <text x="830" y="200" font-size="13" fill="#cbd5e1"> Continuous monitoring</text>
  <text x="830" y="225" font-size="13" fill="#cbd5e1"> A/B test new versions</text>
  <text x="830" y="250" font-size="13" fill="#cbd5e1"> User feedback loop</text>
  <text x="830" y="275" font-size="13" fill="#10b981"> Production ready</text>

  <!-- Monitoring Section -->
  <rect x="50" y="350" width="1100" height="180" fill="#0f172a" stroke="#8b5cf6" stroke-width="3" rx="10"/>
  <text x="600" y="390" font-size="18" fill="#8b5cf6" font-weight="bold" text-anchor="middle">Continuous Monitoring</text>
  <text x="80" y="430" font-size="14" fill="#cbd5e1" font-weight="bold">Key Metrics:</text>
  <text x="100" y="460" font-size="13" fill="#cbd5e1"> Average reward score</text>
  <text x="100" y="485" font-size="13" fill="#cbd5e1"> Response quality (human eval)</text>
  <text x="100" y="510" font-size="13" fill="#cbd5e1"> Latency &amp; throughput</text>

  <text x="650" y="430" font-size="14" fill="#cbd5e1" font-weight="bold">Alert Triggers:</text>
  <text x="670" y="460" font-size="13" fill="#ef4444"> Reward drops &gt;10%</text>
  <text x="670" y="485" font-size="13" fill="#ef4444"> Quality regression</text>
  <text x="670" y="510" font-size="13" fill="#ef4444"> Latency spike</text>

  <!-- Rollback Section -->
  <rect x="50" y="570" width="1100" height="150" fill="#1e293b" stroke="#ef4444" stroke-width="3" rx="10"/>
  <text x="600" y="610" font-size="18" fill="#ef4444" font-weight="bold" text-anchor="middle"> Rollback Strategy</text>
  <text x="80" y="650" font-size="13" fill="#cbd5e1">If issues detected:</text>
  <text x="100" y="675" font-size="13" fill="#cbd5e1">1. Automatic rollback to previous version</text>
  <text x="100" y="700" font-size="13" fill="#cbd5e1">2. Investigate root cause (reward hacking, distribution shift, etc.)</text>

  <rect x="50" y="740" width="1100" height="50" fill="#10b981" rx="8"/>
  <text x="600" y="773" font-size="16" font-weight="bold" fill="white" text-anchor="middle"> Safety First: Test thoroughly before deploying RL models!</text>
</svg>
